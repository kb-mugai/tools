<!DOCTYPE html>
<html lang="ja">
<head>
        <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>脳トロ❤催眠アプリ"ごっこ"|Brain Melt ❤ Hypnotic Heart "Joke App"|即堕ち漫画によくあるジョークアプリ</title>
<meta name="description" content="色指定やオート色循環機能有り。演劇小道具として。長時間凝視はしないこと">
<style>
    :root { --accent: #ff1493; }
    body, html {
        margin:0; padding:0; width:100%; height:100dvh;
        overflow:hidden; background:#000; font-family: sans-serif;
    }
    canvas { display:block; touch-action: none; }

    /* UIレイヤー */
    #ui-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        z-index: 10; transition: opacity 0.4s ease, transform 0.4s ease;
        /* UI表示中のみクリックを有効にする */
        pointer-events: auto; 
    }

    /* 非表示状態：完全にタッチをスルーさせる */
    #ui-layer.hidden { 
        opacity: 0; 
        pointer-events: none; 
        transform: translateY(20px); 
    }

    .panel {
        background: rgba(20, 20, 20, 0.9); color: #fff; padding: 20px; border-radius: 25px;
        width: 85%; max-width: 320px; border: 2px solid var(--accent);
        box-shadow: 0 0 50px rgba(0,0,0,0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }
    .panel h2 { margin: 0 0 15px; font-size: 1rem; color: var(--accent); text-align: center; letter-spacing: 2px; }
    .row { margin-bottom: 12px; display: flex; flex-direction: column; }
    .row label { font-size: 0.75rem; margin-bottom: 5px; color: #ccc; display: flex; justify-content: space-between; align-items: center; }
    
    .auto-label { font-size: 0.7rem; color: var(--accent); cursor: pointer; display: flex; align-items: center; }
    .auto-label input { margin-right: 4px; }

    input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); height: 25px; }
    input[type="color"] { width: 100%; height: 30px; border: none; background: none; cursor: pointer; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 15px; }
    button {
        flex: 1; padding: 14px; border: none; border-radius: 12px;
        font-weight: bold; cursor: pointer; transition: transform 0.1s;
    }
    #reset-btn { background: #444; color: white; }
    #close-btn { background: var(--accent); color: white; }
    button:active { transform: scale(0.95); }

    .warning-text {
        font-size: 0.65rem; color: #ffffff; margin-top: 15px; 
        line-height: 1.5; text-align: center; opacity: 0.8;
    }

    #hint {
        position: fixed; bottom: 20px; width: 100%; text-align: center;
        color: rgba(255,255,255,0.3); font-size: 0.7rem; pointer-events: none;
    }
</style>
</head>
<body>

<div id="ui-layer">
    <div class="panel">
        <h2>脳トロ❤催眠アプリ"ごっこ" <br>ver.1.0.0</h2>
        
        <div class="row">
            <label>背景色相 (BG Hue) 
                <span class="auto-label"><input type="checkbox" id="autoBg">Auto</span>
            </label>
            <input type="range" id="bgHue" min="0" max="360" value="330">
        </div>

        <div class="row">
            <label>リング色（Ring Color）
                <span class="auto-label"><input type="checkbox" id="autoRing">Auto</span>
            </label>
            <input type="color" id="ringCol" value="#ffc0e2">
        </div>

        <div class="row">
            <label>中心ハート色（Core Color）
                <span class="auto-label"><input type="checkbox" id="autoCenter">Auto</span>
            </label>
            <input type="color" id="centerCol" value="#ff1493">
        </div>

        <div class="row">
            <label>リング太さ（Ring Thickness）<span id="val-weight">35</span></label>
            <input type="range" id="weight" min="5" max="80" value="35">
        </div>

        <div class="row">
            <label>生成間隔 (Interval) <span id="val-span">300</span></label>
            <input type="range" id="span" min="200" max="800" value="300">
        </div>

        <div class="btn-group">
            <button id="reset-btn">RESET</button>
            <button id="close-btn">START</button>
        </div>

        <p class="warning-text">
            【ご注意】<br>
            あくまで催眠アプリ"ごっこ"を楽しむジョークアプリです。<br>
            光過敏や乗り物酔いに似た症状を感じる可能性があります。<br>
            長時間の凝視は避けてください。
            <br>
            <a href="../" style="color: #00b7ff; text-decoration: underline; font-size: 0.6rem;">トップページへ戻る</a>
        </p>
    </div>
</div>

<div id="hint">画面をタップで設定を表示</div>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const uiLayer = document.getElementById('ui-layer');
const panel = document.querySelector('.panel');

let width, height, rings = [];

const defaults = {
    bgHue: 330, ringCol: '#ffc0e2', centerCol: '#ff1493',
    weight: 35, span: 300, autoBg: false, autoRing: false, autoCenter: false
};

let config = { ...defaults };

const inputs = {
    bgHue: document.getElementById('bgHue'),
    ringCol: document.getElementById('ringCol'),
    centerCol: document.getElementById('centerCol'),
    weight: document.getElementById('weight'),
    span: document.getElementById('span'),
    autoBg: document.getElementById('autoBg'),
    autoRing: document.getElementById('autoRing'),
    autoCenter: document.getElementById('autoCenter')
};

function updateConfig() {
    config.bgHue = parseInt(inputs.bgHue.value);
    config.ringCol = inputs.ringCol.value;
    config.centerCol = inputs.centerCol.value;
    config.weight = parseInt(inputs.weight.value);
    config.span = parseInt(inputs.span.value);
    config.autoBg = inputs.autoBg.checked;
    config.autoRing = inputs.autoRing.checked;
    config.autoCenter = inputs.autoCenter.checked;
    
    document.getElementById('val-weight').innerText = config.weight;
    document.getElementById('val-span').innerText = config.span;
}

function resetConfig() {
    Object.keys(defaults).forEach(key => {
        if (inputs[key].type === 'checkbox') inputs[key].checked = defaults[key];
        else inputs[key].value = defaults[key];
    });
    updateConfig();
}

// UIイベント
Object.values(inputs).forEach(el => el.addEventListener('input', updateConfig));
document.getElementById('reset-btn').onclick = (e) => { e.stopPropagation(); resetConfig(); };

let isUiVisible = true;
document.getElementById('close-btn').onclick = (e) => {
    e.stopPropagation();
    uiLayer.classList.add('hidden');
    isUiVisible = false;
};

// 画面全体のタップで再表示 (PointerEventでモバイル対応強化)
window.addEventListener('pointerdown', (e) => {
    if(!isUiVisible) {
        uiLayer.classList.remove('hidden');
        isUiVisible = true;
    }
}, { passive: true });

// パネル内タップでUIが閉じないように保護
panel.addEventListener('pointerdown', (e) => {
    if(isUiVisible) e.stopPropagation();
});

const heartPathData = "M50 85 C45 75 30 65 20 55 C5 40 15 20 35 25 C45 28 48 35 50 40 C52 35 55 28 65 25 C85 20 95 40 80 55 C70 65 55 75 50 85 Z";
const baseHeartPath = new Path2D(heartPathData);

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

class Ring {
    constructor(color) {
        this.startTime = Date.now();
        this.scale = 0;
        this.opacity = 1;
        this.color = color;
    }
    update(now) {
        this.scale = Math.pow((now - this.startTime) * 0.0006, 2.2);
        if (this.scale > 7) this.opacity -= 0.05;
    }
    draw() {
        if (this.scale < 0.1 || this.opacity <= 0) return;
        ctx.save();
        ctx.translate(width / 2, height / 2);
        const s = this.scale * 15;
        ctx.scale(s, s);
        ctx.translate(-50, -58);
        ctx.globalAlpha = this.opacity;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = config.weight / s;
        ctx.stroke(baseHeartPath);
        ctx.restore();
    }
}

let lastSpawn = 0;

function loop() {
    const now = Date.now();
    const t = now * 0.001;

    let currentBgHue = config.autoBg ? (t * 10) % 360 : config.bgHue;
    let currentRingCol = config.autoRing ? `hsl(${(t * 10) % 360}, 80%, 85%)` : config.ringCol;
    let currentCenterCol = config.autoCenter ? `hsl(${(t * 10 + 180) % 360}, 100%, 50%)` : config.centerCol;

    const glow = 10 + Math.sin(t * 0.8) * 5;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = `hsl(${currentBgHue}, 100%, ${45 + glow}%)`;
    ctx.fillRect(0, 0, width, height);
    ctx.globalAlpha = 1;

    if (now - lastSpawn > config.span) {
        rings.push(new Ring(currentRingCol));
        lastSpawn = now;
    }
    for (let i = rings.length - 1; i >= 0; i--) {
        rings[i].update(now);
        rings[i].draw();
        if (rings[i].opacity <= 0) rings.splice(i, 1);
    }

    // 中心
    ctx.save();
    ctx.translate(width / 2, height / 2);
    const beat = Math.sin(now / 1000 * Math.PI * 2 * (115 / 60));
    const pulse = 2.5 + (beat > 0 ? Math.pow(beat, 2) * 0.5 : 0);
    ctx.scale(pulse, pulse);
    ctx.translate(-50, -58);
    ctx.fillStyle = currentCenterCol;
    ctx.fill(baseHeartPath);
    ctx.restore();

    // フォグ
    const fog = ctx.createRadialGradient(width/2, height/2, width*0.1, width/2, height/2, width*0.7);
    fog.addColorStop(0, "transparent");
    fog.addColorStop(1, "rgba(0,0,0,0.5)");
    ctx.fillStyle = fog;
    ctx.fillRect(0, 0, width, height);

    requestAnimationFrame(loop);
}

updateConfig();
loop();
</script>

</body>
</html>
