<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Bonfire Hypnosis</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #fire-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #ff8c00 0%, #ff4500 40%, #8b0000 80%, #000 100%);
            animation: colorShift 10s infinite alternate ease-in-out;
            
            /* --- 修正ポイント：ここから --- */
            /* 0.2秒かけて変化を繋ぐ。ease-outで変化の終わりをよりソフトに */
            transition: opacity 0.2s ease-out; 
            will-change: opacity; 
            /* --- 修正ポイント：ここまで --- */
        }

        #noise-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAAV0lEQVRoQ+3BQREAAAgCQMC/bAsXCOwI6VfX4zX3Xo7Hw+FwOBwOh8PhcDgcDofD4XA4HA6Hw+FwOBwOh8PhcDgcDofD4XA4HA6Hw+FwOBwOh8PhcDj8HRwO+w4L8h4LggAAAABJRU5ErkJggg==");
            background-repeat: repeat;
            opacity: 0.1; /* チラつきを抑えるため少し薄くしました */
            pointer-events: none;
        }

        @keyframes colorShift {
            0% { filter: hue-rotate(0deg) saturate(1); }
            100% { filter: hue-rotate(15deg) saturate(1.2); }
        }

        #ui {
            position: relative;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="fire-light"></div>
    <div id="noise-overlay"></div>

    <div id="ui">
        <h1>BONFIRE HYPNOSIS</h1>
        <p>Gaze into the light...</p>
    </div>

    <script>
        const fireLight = document.getElementById('fire-light');

        function flicker() {
            // 明るさの落差を小さく調整 (0.8 〜 1.0の間)
            const baseOpacity = 0.8;
            const randomVariance = Math.random() * 0.2;
            const newOpacity = baseOpacity + randomVariance;

            fireLight.style.opacity = newOpacity;

            // 次の変化までの時間を少し伸ばして、transitionが効く余白を作る
            // (150ms 〜 300ms)
            const nextFlicker = 150 + (Math.random() * 150);
            
            setTimeout(flicker, nextFlicker);
        }

        flicker();

        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
