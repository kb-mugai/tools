<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360° Stream Radar - Stable</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        /* 全画面に重ねるコンテナ */
        #viewer-paints {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .video-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 56.25vw; /* 16:9 */
            opacity: 0.01; /* スリープ防止のため完全には消さない */
            transition: opacity 0.2s ease-out;
            pointer-events: none;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* レーダーUI */
        #radar-container {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 120px;
            border-radius: 50%; border: 2px solid #0f0;
            background: rgba(0, 40, 0, 0.4);
        }
        .radar-dot {
            position: absolute; width: 8px; height: 8px;
            background: #fff; border-radius: 50%;
            top: 50%; left: 50%; transform-origin: 0 -55px;
        }

        /* 設定パネル */
        #settings {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; box-sizing: border-box;
        }
        input { width: 100%; margin-bottom: 10px; padding: 10px; background: #222; color: #fff; border: 1px solid #444; }
        button { width: 100%; padding: 20px; background: #28a745; color: #fff; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div id="settings">
    <h2>📡 配信配置設定</h2>
    <div>
        URL 1: <input type="text" class="v-url" value="https://www.youtube.com/watch?v=letYicNyuJw">
        角度: <input type="number" class="v-angle" value="0">
    </div>
    <div>
        URL 2: <input type="text" class="v-url" value="https://www.youtube.com/watch?v=apwfffh40Yw">
        角度: <input type="number" class="v-angle" value="30">
    </div>
    <button onclick="startApp()">センサーを有効化して開始</button>
</div>

<div id="viewer-paints"></div>
<div id="radar-container"><div id="center-line" style="position:absolute; top:0; left:50%; width:2px; height:15px; background:red;"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let players = [];
let videoData = [];
let baseHeading = null;

function startApp() {
    const urls = document.querySelectorAll('.v-url');
    const angles = document.querySelectorAll('.v-angle');
    
    videoData = Array.from(urls).map((el, i) => ({
        id: extractID(el.value),
        angle: parseFloat(angles[i].value)
    }));

    const container = document.getElementById('viewer-paints');
    container.innerHTML = '';

    videoData.forEach((data, i) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'video-wrapper';
        wrapper.id = `wrapper-${i}`;
        const playerDiv = document.createElement('div');
        playerDiv.id = `player-${i}`;
        wrapper.appendChild(playerDiv);
        container.appendChild(wrapper);
        
        players[i] = new YT.Player(`player-${i}`, {
            videoId: data.id,
            playerVars: { 'autoplay': 1, 'mute': 1, 'controls': 0, 'playsinline': 1 },
            events: {
                'onReady': (e) => {
                    e.target.setPlaybackQuality('small'); // 負荷軽減
                    e.target.playVideo();
                }
            }
        });

        const dot = document.createElement('div');
        dot.className = 'radar-dot';
        dot.style.transform = `translate(-50%, -50%) rotate(${data.angle}deg)`;
        document.getElementById('radar-container').appendChild(dot);
    });

    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(res => { if (res === 'granted') initSensor(); });
    } else { initSensor(); }
    
    document.getElementById('settings').style.display = 'none';
}

function extractID(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
}

function initSensor() {
    window.addEventListener('deviceorientation', (e) => {
        let heading = e.webkitCompassHeading || (360 - e.alpha);
        if (baseHeading === null) baseHeading = heading;
        
        let relativeHeading = heading - baseHeading;
        // 角度の正規化 (-180 to 180)
        if (relativeHeading > 180) relativeHeading -= 360;
        if (relativeHeading < -180) relativeHeading += 360;

        videoData.forEach((data, i) => {
            let diff = Math.abs(relativeHeading - data.angle);
            if (diff > 180) diff = 360 - diff;

            // 視覚的な重なり（30度以内でクロスフェード）
            let opacity = Math.max(0.01, 1 - (diff / 30));
            document.getElementById(`wrapper-${i}`).style.opacity = opacity;

            // 音量制御
            if (players[i] && players[i].setVolume) {
                let vol = Math.max(0, 100 - (diff * 4)); // 25度離れると無音
                players[i].setVolume(vol);
                if (vol > 0) players[i].unMute(); else players[i].mute();
            }
        });

        // レーダーの回転
        document.getElementById('radar-container').style.transform = `translateX(-50%) rotate(${-relativeHeading}deg)`;
    });
}
</script>
</body>
</html>
