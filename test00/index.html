<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Perfect Smooth Heart Tunnel</title>
<style>
body, html {
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#000;
}
canvas { display:block; }
#permission-btn {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    padding: 15px 30px; font-size: 18px; background: #ff1493; color: white;
    border: none; border-radius: 30px; cursor: pointer; z-index: 100;
    display: none; box-shadow: 0 0 20px rgba(255,20,147,0.5);
    font-family: sans-serif;
}
</style>
</head>
<body>

<button id="permission-btn">タップしてセンサーを有効にする</button>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('permission-btn');

let width, height;
let rings = [];

// --- ジャイロ制御用の変数 ---
let targetRotation = 0;   // センサーが示す目標角度
let currentRotation = 0;  // 実際に描画で使う滑らかな角度
const lerpFactor = 0.15;  // 追従の滑らかさ (0.05〜0.2の間で調整)

const config = {
    spawnInterval: 300,
    expandSpeed: 0.0006,
    color: '#ffc0e2',
    centerColor: '#ff1493',
    lineWidth: 35
};

const heartPathData = "M50 85 C45 75 30 65 20 55 C5 40 15 20 35 25 C45 28 48 35 50 40 C52 35 55 28 65 25 C85 20 95 40 80 55 C70 65 55 75 50 85 Z";
const baseHeartPath = new Path2D(heartPathData);

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// センサーイベントハンドラ
function handleOrientation(event) {
    const x = event.gamma; // 左右の傾き
    const y = event.beta;  // 前後の傾き
    
    if (x !== null && y !== null) {
        // 重力方向の計算
        targetRotation = Math.atan2(x, y);
    }
}

// 権限リクエスト
function requestPermission() {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation);
                    btn.style.display = 'none';
                }
            })
            .catch(console.error);
    } else {
        window.addEventListener('deviceorientation', handleOrientation);
        btn.style.display = 'none';
    }
}

if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    btn.style.display = 'block';
    btn.onclick = requestPermission;
} else {
    window.addEventListener('deviceorientation', handleOrientation);
}

class Ring {
    constructor() {
        this.startTime = Date.now();
        this.scale = 0;
        this.opacity = 1;
    }

    update(now) {
        const elapsed = now - this.startTime;
        this.scale = Math.pow(elapsed * config.expandSpeed, 2.2);
        if (this.scale > 7) this.opacity -= 0.05;
    }

    draw() {
        if (this.scale < 0.1 || this.opacity <= 0) return;
        ctx.save();
        ctx.translate(width / 2, height / 2);
        
        // 滑らかな角度を適用（逆回転させて向きを固定）
        ctx.rotate(-currentRotation);
        
        const s = this.scale * 15;
        ctx.scale(s, s);
        ctx.translate(-50, -58);
        ctx.globalAlpha = this.opacity;
        ctx.strokeStyle = config.color;
        ctx.lineWidth = config.lineWidth / s;
        ctx.lineJoin = 'miter';
        ctx.miterLimit = 10;
        ctx.stroke(baseHeartPath);
        ctx.restore();
    }
}

let lastSpawn = 0;

function loop() {
    const now = Date.now();

    // --- 角度の最短経路補間 (Lerp) ---
    let diff = targetRotation - currentRotation;
    // 180度を超えて回転しないように補正
    if (diff > Math.PI) diff -= Math.PI * 2;
    if (diff < -Math.PI) diff += Math.PI * 2;
    currentRotation += diff * lerpFactor;

    const t = now * 0.001;
    const glow = 10 + Math.sin(t * 0.8) * 5;

    // 背景描画
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = `hsl(330, 100%, ${45 + glow}%)`;
    ctx.fillRect(0, 0, width, height);
    ctx.globalAlpha = 1;

    // リング生成と描画
    if (now - lastSpawn > config.spawnInterval) {
        rings.push(new Ring());
        lastSpawn = now;
    }

    for (let i = rings.length - 1; i >= 0; i--) {
        rings[i].update(now);
        rings[i].draw();
        if (rings[i].opacity <= 0) rings.splice(i, 1);
    }

    // 中心グロー
    const grad = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, 350);
    grad.addColorStop(0, "rgba(255,20,147,0.35)");
    grad.addColorStop(1, "rgba(255,20,147,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // 中心の鼓動ハート
    ctx.save();
    ctx.translate(width / 2, height / 2);
    ctx.rotate(-currentRotation); // 滑らかな角度を適用
    const beat = Math.sin(now / 1000 * Math.PI * 2 * (115 / 60));
    const pulse = 2.5 + (beat > 0 ? Math.pow(beat, 2) * 0.5 : 0);
    ctx.scale(pulse, pulse);
    ctx.translate(-50, -58);
    ctx.fillStyle = config.centerColor;
    ctx.fill(baseHeartPath);
    ctx.restore();

    // 奥行きフォグ
    const fog = ctx.createRadialGradient(width/2, height/2, width*0.3, width/2, height/2, width*0.9);
    fog.addColorStop(0, "rgba(0,0,0,0)");
    fog.addColorStop(1, "rgba(0,0,0,0.45)");
    ctx.fillStyle = fog;
    ctx.fillRect(0, 0, width, height);

    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
