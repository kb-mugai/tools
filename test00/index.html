<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音コンパス</title>
<style>
  body {
    text-align: center;
    font-family: sans-serif;
    padding-top: 40px;
  }
  #degree {
    font-size: 2em;
    margin: 20px;
  }
  button {
    font-size: 1.2em;
    padding: 10px 20px;
  }
</style>
</head>
<body>

<h1>音コンパス（最小版）</h1>
<div id="degree">--°</div>
<button id="startBtn">センサー許可</button>

<script>
let audioCtx;
let lastBeep = 0;
let target = 0; // 北固定（あとで基準モード追加可能）

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq, duration=0.1) {
  if (!audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";
  osc.frequency.value = freq;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.value = 0.3;

  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function getDiff(target, current) {
  let diff = target - current;
  diff = (diff + 540) % 360 - 180;
  return diff;
}

function handleOrientation(event) {
  let heading;

  if (event.webkitCompassHeading !== undefined) {
    heading = event.webkitCompassHeading;
  } else {
    heading = 360 - event.alpha;
  }

  if (!heading) return;

  const diff = getDiff(target, heading);
  const absDiff = Math.abs(diff);

  document.getElementById("degree").textContent =
    Math.round(heading) + "° / diff: " + Math.round(diff);

  const now = Date.now();

  // 周波数をズレ量で変化（小さいほど高音）
  const freq = 300 + (1 - Math.min(absDiff,180)/180) * 800;

  if (absDiff < 10) {
    // ほぼ合ってる → 連続音気味
    if (now - lastBeep > 150) {
      playTone(freq, 0.15);
      lastBeep = now;
    }
  } else {
    // ズレ大きい → ゆっくり
    if (now - lastBeep > 400) {
      playTone(freq, 0.1);
      lastBeep = now;
    }
  }
}

document.getElementById("startBtn").addEventListener("click", async () => {

  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    const permission = await DeviceOrientationEvent.requestPermission();
    if (permission !== "granted") {
      alert("許可が必要です");
      return;
    }
  }

  initAudio();
  window.addEventListener("deviceorientation", handleOrientation);
  document.getElementById("startBtn").style.display = "none";
});
</script>

</body>
</html>
