<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360° Live Radar v1.0</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: manipulation; }
        
        /* 動画表示エリア（全画面重ね） */
        #viewer-paints { position: relative; width: 100vw; height: 100vh; }
        .video-wrapper {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100vw; height: 56.25vw; visibility: hidden; opacity: 0;
            transition: opacity 0.3s ease; pointer-events: none;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* レーダーUI */
        #radar-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 130px; height: 130px; border-radius: 50%; border: 2px solid #00ff96;
            background: rgba(0, 40, 20, 0.6); box-shadow: 0 0 15px rgba(0,255,150,0.3);
        }
        .radar-dot {
            position: absolute; width: 10px; height: 10px; background: #fff;
            border-radius: 50%; top: 50%; left: 50%; transform-origin: 0 -55px;
        }
        #center-marker { position: absolute; top: 0; left: 50%; width: 2px; height: 15px; background: #ff4500; }

        /* 設定パネル */
        #settings {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .input-group { margin-bottom: 20px; padding: 10px; border: 1px solid #333; border-radius: 8px; }
        input { width: 100%; margin-top: 5px; padding: 12px; background: #111; color: #fff; border: 1px solid #555; box-sizing: border-box; }
        button#start-btn { width: 100%; padding: 20px; background: #00ff96; color: #000; border: none; font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer; }
        #info { font-size: 0.8rem; color: #888; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div id="settings">
    <h2 style="color:#00ff96">📡 Stream Radar</h2>
    <div id="inputs-container">
        <div class="input-group">
            URL 1 (正面): <input type="text" class="v-url" value="https://www.youtube.com/watch?v=5CRosk_4u3E">
            角度: <input type="number" class="v-angle" value="0">
        </div>
        <div class="input-group">
            URL 2 (右): <input type="text" class="v-url" value="https://www.youtube.com/watch?v=apwfffh40Yw">
            角度: <input type="number" class="v-angle" value="30">
        </div>
    </div>
    <button id="start-btn" onclick="startApp()">START & SYNC</button>
    <p id="info">※画面ダブルタップで正面をリセット<br>※20°〜40°刻みがおすすめです</p>
</div>

<div id="viewer-paints"></div>
<div id="radar-container"><div id="center-marker"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let players = [];
let videoData = [];
let baseHeading = null;
let isStarted = false;

// 1. YouTube ID抽出
function extractID(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
}

// 2. アプリ開始
async function startApp() {
    const urls = document.querySelectorAll('.v-url');
    const angles = document.querySelectorAll('.v-angle');
    
    videoData = Array.from(urls).map((el, i) => ({
        id: extractID(el.value),
        angle: parseFloat(angles[i].value)
    }));

    const container = document.getElementById('viewer-paints');
    container.innerHTML = '';

    // 🌟 逐次初期化 (async/awaitで1つずつ順番に生成)
    for (let i = 0; i < videoData.length; i++) {
        const data = videoData[i];
        const wrapper = document.createElement('div');
        wrapper.className = 'video-wrapper';
        wrapper.id = `wrapper-${i}`;
        const playerDiv = document.createElement('div');
        playerDiv.id = `player-${i}`;
        wrapper.appendChild(playerDiv);
        container.appendChild(wrapper);
        
        // わずかな遅延を挟んでブラウザのパンクを防ぐ
        await new Promise(resolve => setTimeout(resolve, 500));

        players[i] = new YT.Player(`player-${i}`, {
            videoId: data.id,
            playerVars: { 
                'autoplay': (Math.abs(data.angle) < 15) ? 1 : 0, // 🌟 正面以外は最初は自動再生させない
                'mute': 1, 
                'controls': 0, 
                'playsinline': 1, 
                'rel': 0 
            },
            events: {
                'onReady': (e) => {
                    e.target.setPlaybackQuality('small'); 
                    // 🌟 正面に近い場合のみ、即座にミュート解除して再生
                    if (Math.abs(data.angle) < 15) {
                        e.target.playVideo();
                        e.target.unMute();
                    }
                }
            }
        });

        const dot = document.createElement('div');
        dot.className = 'radar-dot';
        dot.id = `dot-${i}`;
        dot.style.transform = `translate(-50%, -50%) rotate(${data.angle}deg)`;
        document.getElementById('radar-container').appendChild(dot);
    }

    // センサー許可 (iOS)
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === 'granted') initSensor();
    } else { 
        initSensor(); 
    }
    
    document.getElementById('settings').style.display = 'none';
    isStarted = true;
}

// 3. センサー & 更新ロジック
function initSensor() {
    window.addEventListener('deviceorientation', (e) => {
        if (!isStarted) return;
        let heading = e.webkitCompassHeading || (360 - e.alpha);
        if (baseHeading === null) baseHeading = heading;
        
        let relativeHeading = heading - baseHeading;
        if (relativeHeading > 180) relativeHeading -= 360;
        if (relativeHeading < -180) relativeHeading += 360;

        videoData.forEach((data, i) => {
            let diff = Math.abs(relativeHeading - data.angle);
            if (diff > 180) diff = 360 - diff;

            const wrapper = document.getElementById(`wrapper-${i}`);
            const dot = document.getElementById(`dot-${i}`);
            
            // 映像スイッチング (15度以内なら表示)
            if (diff < 15) {
                wrapper.style.visibility = 'visible';
                wrapper.style.opacity = 1;
                dot.style.background = '#00ff96'; // レーダー上の現在地を強調
            } else {
                wrapper.style.visibility = 'hidden';
                wrapper.style.opacity = 0;
                dot.style.background = '#fff';
            }

            // 音声制御 (25度離れると消音)
            if (players[i] && players[i].setVolume) {
                let vol = Math.max(0, 100 - (diff * 4)); 
                players[i].setVolume(vol);
                if (vol > 0) players[i].unMute(); else players[i].mute();
            }
        });

        // レーダー回転
        document.getElementById('radar-container').style.transform = `translateX(-50%) rotate(${-relativeHeading}deg)`;
    });
}

// 4. リセット機能 (ダブルタップ)
window.addEventListener('dblclick', () => {
    baseHeading = null;
    console.log("Center Reset");
});
</script>
</body>
</html>
