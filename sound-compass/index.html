<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Compass Pro</title>
<style>
body{
  margin:0;
  background:#0f1117;
  color:white;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  overflow: hidden;
}

h1{ font-weight:300; letter-spacing:2px; margin-bottom:10px; font-size: 1rem; opacity: 0.5; }

.compass{
  width:280px;
  height:280px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.1);
  position:relative;
  backdrop-filter:blur(8px);
  box-shadow:0 0 40px rgba(0,255,255,0.1);
  display:flex;
  align-items:center;
  justify-content:center;
}

.dial{
  width:100%;
  height:100%;
  position:absolute;
  border-radius:50%;
}

.cardinal {
  position:absolute;
  font-size:18px;
  font-weight:bold;
  color: rgba(255,255,255,0.9);
}
.cardinal.north { color: #ff3d00; }

.tick {
  position: absolute;
  width: 2px;
  height: 10px;
  background: rgba(255,255,255,0.2);
  top: 5px;
  left: calc(50% - 1px);
  transform-origin: 1px 135px;
}
.tick.large { 
  height: 18px; 
  width: 3px;
  background: rgba(255,255,255,0.6); 
}

/* ターゲットマーカー（赤い三角形のガイド） */
.target-marker {
  position: absolute;
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-bottom: 15px solid #ff3d00;
  top: -20px;
  left: calc(50% - 8px);
  transform-origin: 8px 160px;
  display: none;
}

.cross{
  position:absolute;
  width:80px;
  height:80px;
  pointer-events:none;
  z-index: 10;
}
.cross::before, .cross::after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,0.3);
}
.cross::before{ top:50%; left:0; width:100%; height:1px; transform:translateY(-50%);}
.cross::after{ left:50%; top:0; width:1px; height:100%; transform:translateX(-50%);}

.bubble{
  width:24px;
  height:24px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #aef, cyan);
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  opacity:0.9;
  transition: background 0.2s, box-shadow 0.2s;
  z-index: 8;
  box-shadow: 0 0 10px rgba(0,255,255,0.3);
}
.bubble.centered {
  background: radial-gradient(circle at 30% 30%, #fffbcf, #ffeb3b);
  box-shadow: 0 0 20px rgba(255,235,59,0.8);
}

.arrow{
  width:4px;
  height:125px;
  background:linear-gradient(to top, #00f2ff, white);
  position:absolute;
  bottom:50%;
  left:50%;
  transform:translateX(-50%);
  border-radius:2px;
  z-index:12;
}

/* 数値表示エリア */
.display-container {
  margin-top: 20px;
  display: flex;
  gap: 20px;
  align-items: flex-end;
  font-variant-numeric: tabular-nums;
}
.sub-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 70px;
}
.sub-label { font-size: 10px; opacity: 0.5; text-transform: uppercase; }
.sub-val { font-size: 16px; font-weight: 300; }

.main-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100px;
}
.main-label { font-size: 12px; color: cyan; font-weight: bold; }
.main-val { font-size: 42px; font-weight: bold; line-height: 1; }

.controls { margin-top: 30px; }

button{
  padding:12px 20px;
  border:none;
  border-radius:25px;
  background:rgba(255,255,255,0.1);
  color:white;
  font-size:14px;
  margin: 5px;
  border: 1px solid rgba(255,255,255,0.2);
}
#startBtn { background:linear-gradient(45deg,#00d2ff,#6a5cff); border:none; padding: 15px 40px; font-size: 1.1rem; }
</style>
</head>
<body>

<h1>SOUND COMPASS</h1>

<div class="compass">
  <div class="dial" id="dial">
    <div class="target-marker" id="targetMarker"></div>
  </div>
  <div class="bubble" id="bubble"></div>
  <div class="cross"></div>
  <div class="arrow"></div>
</div>

<div class="display-container">
    <div class="sub-display">
        <span class="sub-label">Target</span>
        <span class="sub-val" id="targetVal">0°</span>
    </div>
    <div class="main-display">
        <span class="main-label" id="modeLabel">NORTH</span>
        <span class="main-val" id="currentVal">--°</span>
    </div>
    <div class="sub-display">
        <span class="sub-label">Diff</span>
        <span class="sub-val" id="diffVal">0°</span>
    </div>
</div>

<div class="controls">
    <button id="startBtn">START</button>
    <button id="modeBtn" style="display:none;">北基準</button>
    <button id="soundBtn" style="display:none;">音: ON</button>
</div>

<script>
let audioCtx, osc, gainNode;
let heading = 0, displayHeading = 0, target = 0;
let useNorth = true, lastBeep = 0, soundEnabled = true;
let smoothX = 0, smoothY = 0;

const dial = document.getElementById('dial');
const mainPoints = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' };

for (let i = 0; i < 360; i += 15) {
    const tick = document.createElement('div');
    tick.className = (i % 45 === 0) ? 'tick large' : 'tick';
    tick.style.transform = `rotate(${i}deg)`;
    dial.appendChild(tick);

    if (mainPoints[i] !== undefined) {
        const span = document.createElement('div');
        span.className = 'cardinal';
        if(i === 0) span.classList.add('north');
        span.textContent = mainPoints[i];
        const angleRad = (i - 90) * (Math.PI / 180);
        const radius = 105; 
        const x = 140 + radius * Math.cos(angleRad);
        const y = 140 + radius * Math.sin(angleRad);
        span.style.left = `${x}px`;
        span.style.top = `${y}px`;
        span.style.transform = `translate(-50%, -50%) rotate(${i}deg)`;
        dial.appendChild(span);
    }
}

function initAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator();
  gainNode = audioCtx.createGain();
  osc.type = "sine";
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  gainNode.gain.value = 0;
  osc.start();
}

function normalize(angle){ return ((angle % 360) + 360) % 360; }
function getDiff(target,current){
  let diff = target - current;
  diff = (diff + 540) % 360 - 180;
  return diff;
}

function handleOrientation(event){
  if(event.webkitCompassHeading !== undefined){
    heading = event.webkitCompassHeading;
  }else{
    heading = 360 - event.alpha;
  }
  if(heading == null) return;
  heading = normalize(heading);

  let diffAngle = heading - displayHeading;
  diffAngle = (diffAngle + 540) % 360 - 180;
  displayHeading += diffAngle * 0.2;

  document.getElementById("dial").style.transform = `rotate(${-displayHeading}deg)`;
  
  const diff = getDiff(target, heading);
  const absDiff = Math.abs(diff);

  // 数値更新
  document.getElementById("currentVal").textContent = `${Math.round(heading)}°`;
  document.getElementById("targetVal").textContent = `${Math.round(target)}°`;
  document.getElementById("diffVal").textContent = `${diff > 0 ? '+' : ''}${Math.round(diff)}°`;

  // 相対モードの時だけダイヤル上に赤いターゲットマーカーを表示
  const marker = document.getElementById("targetMarker");
  if(!useNorth) {
      marker.style.display = "block";
      marker.style.transform = `rotate(${target}deg)`;
  } else {
      marker.style.display = "none";
  }

  // ---- 水平バブル ----
  const rawX = event.gamma || 0;
  const rawY = event.beta || 0;
  const limit = 45;
  const moveX = Math.max(-limit, Math.min(limit, rawX));
  const moveY = Math.max(-limit, Math.min(limit, rawY));
  smoothX = smoothX * 0.8 + moveX * 0.2;
  smoothY = smoothY * 0.8 + moveY * 0.2;

  const bubbleEl = document.getElementById("bubble");
  bubbleEl.style.transform = `translate(calc(-50% + ${smoothX}px), calc(-50% + ${smoothY}px))`;

  if(Math.abs(rawX) < 3 && Math.abs(rawY) < 3) {
      bubbleEl.classList.add('centered');
  } else {
      bubbleEl.classList.remove('centered');
  }

  // ---- 音ロジック ----
  if(!soundEnabled || !audioCtx) return;
  if(absDiff <= 5){
    osc.frequency.setTargetAtTime(1200, audioCtx.currentTime, 0.1);
    gainNode.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.1);
  } else {
    gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
    const now = Date.now();
    if(now - lastBeep > (150 + absDiff * 4)){ 
      beep(absDiff);
      lastBeep = now;
    }
  }
}

function beep(absDiff){
  if(!soundEnabled) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const freq = 400 + (1 - Math.min(absDiff,180)/180)*600;
  o.frequency.value = freq;
  o.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.2, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
  o.start();
  o.stop(audioCtx.currentTime + 0.12);
}

document.getElementById("startBtn").addEventListener("click", async()=>{
  if(typeof DeviceOrientationEvent.requestPermission === "function"){
    const permission = await DeviceOrientationEvent.requestPermission();
    if(permission !== "granted") return;
  }
  initAudio();
  window.addEventListener("deviceorientation", handleOrientation);
  document.getElementById("startBtn").style.display="none";
  document.getElementById("modeBtn").style.display="inline-block";
  document.getElementById("soundBtn").style.display="inline-block";
});

document.getElementById("modeBtn").addEventListener("click",()=>{
  useNorth = !useNorth;
  target = useNorth ? 0 : normalize(heading);
  document.getElementById("modeBtn").textContent = useNorth ? "北基準" : "相対基準";
  document.getElementById("modeLabel").textContent = useNorth ? "NORTH" : "RELATIVE";
});

document.getElementById("soundBtn").addEventListener("click", ()=>{
  soundEnabled = !soundEnabled;
  if(!soundEnabled && gainNode) gainNode.gain.value = 0;
  document.getElementById("soundBtn").textContent = soundEnabled ? "音: ON" : "音: OFF";
});
</script>
</body>
</html>
