<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Compass|音コンパス</title>
<meta name="description" content="音で方向を示してくれるコンパスです。北基準モードと現在方向基準モード。登録不要・無料で使えます。">
<link rel="stylesheet" href="../common.css">

<style>
body{
  margin:0;
  background:#0f1117;
  color:white;
  font-family:system-ui;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

h1{
  font-weight:300;
  letter-spacing:2px;
  margin-bottom:10px;
}

.compass{
  width:260px;
  height:260px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.1);
  position:relative;
  backdrop-filter:blur(8px);
  box-shadow:0 0 40px rgba(0,255,255,0.08);
}

.cardinal{
  position:absolute;
  font-size:14px;
  font-weight:600;
  opacity:0.8;
}

.n{ top:8px; left:50%; transform:translateX(-50%); }
.s{ bottom:8px; left:50%; transform:translateX(-50%); }
.e{ right:8px; top:50%; transform:translateY(-50%); }
.w{ left:8px; top:50%; transform:translateY(-50%); }

.arrow{
  width:4px;
  height:110px;
  background:linear-gradient(to top, cyan, white);
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:50% 100%;
  transform:translateX(-50%) rotate(0deg);
  transition: transform 0.1s linear;
  border-radius:2px;
}

.marker{
  width:6px;
  height:110px;
  background:linear-gradient(to top, red, transparent);
  position:absolute;
  bottom:50%;
  left:50%;
  transform-origin:50% 100%;
  transform:translateX(-50%) rotate(0deg);
  transition: transform 0.2s ease;
  opacity:0.8;
}

.info{
  margin-top:20px;
  font-size:14px;
  opacity:0.7;
  text-align:center;
}

button{
  margin-top:10px;
  padding:10px 18px;
  border:none;
  border-radius:20px;
  background:linear-gradient(45deg,cyan,#6a5cff);
  color:white;
  font-size:14px;
}

.nav-wrapper {
  max-width: 300px;
  margin: 0 auto 10px;
  text-align: left;
  padding: 0 25px;
  box-sizing: border-box;
}
</style>
</head>

<body>

<div class="nav-wrapper">
  <a href="../" class="back-button">← トップページに戻る</a>
</div>

<h1>SOUND COMPASS ver1.0.1</h1>
<p>音で方向を示してくれるコンパス。北基準と現在方角基準モードを切替できます。</p>

<div class="compass">
  <div class="cardinal n">N</div>
  <div class="cardinal e">E</div>
  <div class="cardinal s">S</div>
  <div class="cardinal w">W</div>
  <div class="marker" id="marker"></div>
  <div class="arrow" id="arrow"></div>
</div>

<div class="info" id="info">待機中...</div>

<button id="startBtn">開始</button>
<button id="modeBtn" style="display:none;">基準: 北</button>
<button id="soundBtn" style="display:none;">音: ON</button>

<script>
let audioCtx;
let osc;
let gainNode;

let target = 0;
let heading = 0;
let useNorth = true;
let lastBeep = 0;
let displayAngle = 0;
let soundEnabled = true;

function initAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator();
  gainNode = audioCtx.createGain();
  osc.type = "sine";
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  gainNode.gain.value = 0;
  osc.start();
}

function normalize(angle){
  return ((angle % 360) + 360) % 360;
}

function getDiff(target,current){
  let diff = target - current;
  diff = (diff + 540) % 360 - 180;
  return diff;
}

function handleOrientation(event){

  if(event.webkitCompassHeading !== undefined){
    heading = event.webkitCompassHeading;
  }else{
    heading = 360 - event.alpha;
  }

  if(heading == null) return;

  heading = normalize(heading);

  let diffAngle = heading - displayAngle;
  diffAngle = (diffAngle + 540) % 360 - 180;
  displayAngle += diffAngle;

  document.getElementById("arrow")
    .style.transform = `translateX(-50%) rotate(${displayAngle}deg)`;

  document.getElementById("marker")
    .style.transform = `translateX(-50%) rotate(${target}deg)`;

  const diff = getDiff(target, heading);
  const absDiff = Math.abs(diff);

  document.getElementById("info").textContent =
    `現在:${Math.round(heading)}°  基準:${Math.round(normalize(target))}°  ズレ:${Math.round(diff === 180 ? -180 : diff)}°`;

  if(!soundEnabled || !audioCtx) return;

  if(absDiff <= 5){
    osc.frequency.value = 1200;
    gainNode.gain.value = 0.25;
  }
  else if(absDiff >= 175){
    osc.frequency.value = 200;
    gainNode.gain.value = 0.25;
  }
  else{
    gainNode.gain.value = 0;
    const now = Date.now();

    if(absDiff < 45){
      if(now - lastBeep > 120){
        beep(absDiff);
        lastBeep = now;
      }
    }else{
      if(now - lastBeep > 400){
        beep(absDiff);
        lastBeep = now;
      }
    }
  }
}

function beep(absDiff){
  if(!soundEnabled) return;

  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const freq = 400 + (1 - Math.min(absDiff,180)/180)*600;

  o.frequency.value = freq;
  o.connect(g);
  g.connect(audioCtx.destination);

  g.gain.value = 0.3;
  o.start();
  o.stop(audioCtx.currentTime + 0.1);
}

document.getElementById("startBtn")
.addEventListener("click", async()=>{

  if(typeof DeviceOrientationEvent.requestPermission === "function"){
    const permission = await DeviceOrientationEvent.requestPermission();
    if(permission !== "granted"){
      alert("許可が必要です");
      return;
    }
  }

  initAudio();
  window.addEventListener("deviceorientation",handleOrientation);

  document.getElementById("startBtn").style.display="none";
  document.getElementById("modeBtn").style.display="inline-block";
  document.getElementById("soundBtn").style.display="inline-block";
});

document.getElementById("modeBtn")
.addEventListener("click",()=>{

  if(useNorth){
    target = normalize(heading);
    useNorth = false;
    document.getElementById("modeBtn").textContent="基準: 現在方向";
  }else{
    target = 0;
    useNorth = true;
    document.getElementById("modeBtn").textContent="基準: 北";
  }
});

document.getElementById("soundBtn")
.addEventListener("click", async()=>{

  soundEnabled = !soundEnabled;

  if(!soundEnabled && gainNode){
    gainNode.gain.value = 0;
  }

  if(soundEnabled && audioCtx && audioCtx.state === "suspended"){
    await audioCtx.resume();
  }

  document.getElementById("soundBtn").textContent =
    soundEnabled ? "音: ON" : "音: OFF";
});
</script>

</body>
</html>
