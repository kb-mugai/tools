<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">

<meta name="mobile-web-app-capable" content="yes">

<title>Sound Compass|音コンパス</title>
<meta name="description" content="音コンパス。北基準モード、相対モード。水平バブル。登録不要・無料で使えます。">
<link rel="stylesheet" href="../common.css">
<style>
/* スタイルは変更なし */
body {
  margin: 0;
  background: #0f1117;
  color: white;
  font-family: system-ui;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  /* 変更点：最低の高さを100dvhにし、はみ出したらスクロール許可 */
  min-height: 100dvh; 
  overflow-y: auto; 
  overflow-x: hidden;
  /* iOSでのスクロールを滑らかにする */
  -webkit-overflow-scrolling: touch; 
  
  /* 下部の余白（ツールバー回避用） */
  padding-bottom: 60px; 
  padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
  box-sizing: border-box;
}
html {
  background: #0f1117;
}
.compass{ width:280px; height:280px; border-radius:50%; border:2px solid rgba(255,255,255,0.1); position:relative; display:flex; align-items:center; justify-content:center; }
.dial{ width:100%; height:100%; position:absolute; }
.tick { position: absolute; width: 2px; height: 10px; background: rgba(255,255,255,0.2); top: 5px; left: calc(50% - 1px); transform-origin: 1px 135px; }
.tick.large { height: 18px; width: 3px; background: rgba(255,255,255,0.6); }
.cardinal { position:absolute; font-size:18px; font-weight:bold; color: rgba(255,255,255,0.9); }
.cardinal.north { color: #ff3d00; }
.target-marker { position: absolute; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 15px solid #ff3d00; top: -20px; left: calc(50% - 8px); transform-origin: 8px 160px; display: none; }
.bubble{ width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #fff, cyan); position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index: 8; box-shadow: 0 0 15px rgba(0,255,255,0.4); }
.bubble.centered { background: radial-gradient(circle at 30% 30%, #fff, #ffeb3b); box-shadow: 0 0 25px rgba(255,235,59,1); }
.cross{ position:absolute; width:80px; height:80px; pointer-events:none; z-index: 10; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; }
.cross::before, .cross::after{ content:""; position:absolute; background:rgba(255,255,255,0.3); }
.cross::before{ top:50%; left:0; width:100%; height:1px; transform:translateY(-50%);}
.cross::after{ left:50%; top:0; width:1px; height:100%; transform:translateX(-50%);}
.arrow{ width:4px; height:125px; background:linear-gradient(to top, #00f2ff, white); position:absolute; bottom:50%; left:50%; transform:translateX(-50%); z-index:12; }
.display-container { margin-top: 25px; display: flex; gap: 20px; align-items: flex-end; }
.sub-display { display: flex; flex-direction: column; align-items: center; width: 70px; }
.sub-label { font-size: 10px; opacity: 0.5; }
.sub-val { font-size: 16px; font-weight: 300; }
.main-display { display: flex; flex-direction: column; align-items: center; width: 100px; }
.main-val { font-size: 42px; font-weight: bold; line-height: 1; font-variant-numeric: tabular-nums; }
.controls {
  margin-top: 40px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px; /* ボタン同士の間隔 */
  align-items: center;
}
button{ padding:12px 24px; border-radius:25px; background:rgba(255,255,255,0.05); color:white; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; -webkit-tap-highlight-color: transparent; }
#startBtn { background:linear-gradient(45deg,#00d2ff,#6a5cff); border:none; padding: 15px 40px; }
.nav-wrapper { max-width: 300px; margin: 0 auto 10px; text-align: left; padding: 0 25px; box-sizing: border-box; }
</style>

<body>
<div class="nav-wrapper">
  <a href="../" class="back-button">← トップページに戻る</a>
</div>
<br>
<h1>SOUND COMPASS ver1.1.1</h1>
音コンパス。北基準と相対基準（現在角度指定）モード有り。水平バブル付き。
<p>
<div class="compass">
  <div class="dial" id="dial"><div class="target-marker" id="targetMarker"></div></div>
  <div class="bubble" id="bubble"></div>
  <div class="cross"></div>
  <div class="arrow"></div>
</div>
<div class="display-container">
    <div class="sub-display"><span class="sub-label">TARGET</span><span id="targetVal" class="sub-val">0°</span></div>
    <div class="main-display"><span id="modeLabel" style="font-size:10px; color:cyan;">NORTH</span><span id="currentVal" class="main-val">0°</span></div>
    <div class="sub-display"><span class="sub-label">DIFF</span><span id="diffVal" class="sub-val">0°</span></div>
</div>
<div class="controls">
    <button id="startBtn">START</button>
    <button id="modeBtn" style="display:none;">北基準</button>
    <button id="soundBtn" style="display:none;">音: ON</button>
</div>

<script>
let audioCtx, osc, gainNode;
let heading = 0, displayHeading = 0, target = 0;
let useNorth = true, lastBeep = 0, soundEnabled = true;
let rawX = 0, rawY = 0, smoothX = 0, smoothY = 0;
let wakeLock = null;

// 目盛り生成
const dial = document.getElementById('dial');
const mainPoints = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' };
for (let i = 0; i < 360; i += 15) {
    const tick = document.createElement('div');
    tick.className = (i % 45 === 0) ? 'tick large' : 'tick';
    tick.style.transform = `rotate(${i}deg)`;
    dial.appendChild(tick);
    if (mainPoints[i] !== undefined) {
        const span = document.createElement('div');
        span.className = 'cardinal';
        if(i === 0) span.classList.add('north');
        span.textContent = mainPoints[i];
        const angleRad = (i - 90) * (Math.PI / 180);
        const xPos = 140 + 105 * Math.cos(angleRad);
        const yPos = 140 + 105 * Math.sin(angleRad);
        span.style.left = `${xPos}px`; span.style.top = `${yPos}px`;
        span.style.transform = `translate(-50%, -50%) rotate(${i}deg)`;
        dial.appendChild(span);
    }
}

// スクリーン常時点灯のリクエスト（Wake Lock API）
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('Wake Lock is active');
    }
  } catch (err) {
    console.error(`${err.name}, ${err.message}`);
  }
}

async function resumeAudio() {
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') {
    resumeAudio();
    requestWakeLock(); // 復帰時に再リクエスト
  }
});

function initAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator();
  gainNode = audioCtx.createGain();
  osc.type = "triangle";
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  gainNode.gain.value = 0;
  osc.start();
}

function handleOrientation(event){
  if (audioCtx && audioCtx.state === 'suspended' && soundEnabled) audioCtx.resume();

  let h = event.webkitCompassHeading || (360 - event.alpha);
  if(h != null) heading = Math.round(h) % 360;

  let x = event.gamma || 0;
  let y = event.beta || 0;
  if (y > 90) y = 180 - y;
  if (y < -90) y = -180 - y;
  if (Math.abs(event.beta) > 90) x = -x;
  rawX = x; rawY = y;

  processSound();
}

function processSound() {
  if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
  const diff = (target - heading + 540) % 360 - 180;
  const absDiff = Math.abs(Math.round(diff));

  if(absDiff <= 5){
    osc.frequency.setTargetAtTime(1000, audioCtx.currentTime, 0.03);
    gainNode.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.03);
  } else if(absDiff >= 175){
    osc.frequency.setTargetAtTime(400, audioCtx.currentTime, 0.03);
    gainNode.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.03);
  } else {
    gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.03);
    const now = Date.now();
    if(now - lastBeep > (120 + absDiff * 4.5)){ 
      beep(absDiff);
      lastBeep = now;
    }
  }
}

function beep(absDiff){
  if(!soundEnabled || !audioCtx || audioCtx.state !== 'running') return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "triangle";
  const freq = 300 + (1 - Math.min(absDiff, 180)/180) * 600;
  o.frequency.value = freq;
  o.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.25, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
  o.start();
  o.stop(audioCtx.currentTime + 0.12);
}

function updateVisuals() {
  let diffAngle = (heading - displayHeading + 540) % 360 - 180;
  displayHeading += diffAngle * 0.2;
  document.getElementById("dial").style.transform = `rotate(${-displayHeading}deg)`;
  
  const diff = (target - heading + 540) % 360 - 180;
  document.getElementById("currentVal").textContent = `${heading}°`;
  document.getElementById("targetVal").textContent = `${Math.round(target) % 360}°`;
  document.getElementById("diffVal").textContent = `${diff > 0 ? '+' : ''}${Math.round(diff)}°`;

  const marker = document.getElementById("targetMarker");
  marker.style.display = useNorth ? "none" : "block";
  marker.style.transform = `rotate(${target}deg)`;

  const limit = 60;
  smoothX = smoothX * 0.8 + Math.max(-limit, Math.min(limit, rawX)) * 0.2;
  smoothY = smoothY * 0.8 + Math.max(-limit, Math.min(limit, rawY)) * 0.2;

  const bubbleEl = document.getElementById("bubble");
  bubbleEl.style.transform = `translate(calc(-50% + ${smoothX}px), calc(-50% + ${smoothY}px))`;
  bubbleEl.className = (Math.abs(rawX) < 2.5 && Math.abs(rawY) < 2.5) ? 'bubble centered' : 'bubble';

  requestAnimationFrame(updateVisuals);
}

document.getElementById("startBtn").addEventListener("click", async()=>{
  if(typeof DeviceOrientationEvent.requestPermission === "function"){
    const permission = await DeviceOrientationEvent.requestPermission();
    if(permission !== "granted") return;
  }
  requestWakeLock(); // 常時点灯開始
  initAudio();
  window.addEventListener("deviceorientation", handleOrientation);
  updateVisuals();
  document.getElementById("startBtn").style.display="none";
  document.getElementById("modeBtn").style.display="inline-block";
  document.getElementById("soundBtn").style.display="inline-block";
});

document.getElementById("modeBtn").addEventListener("click",()=>{
  resumeAudio();
  useNorth = !useNorth;
  target = useNorth ? 0 : heading;
  document.getElementById("modeBtn").textContent = useNorth ? "北基準" : "相対基準";
  document.getElementById("modeLabel").textContent = useNorth ? "NORTH" : "RELATIVE";
});

document.getElementById("soundBtn").addEventListener("click", async ()=>{
  soundEnabled = !soundEnabled;
  if(soundEnabled) await resumeAudio();
  else if(gainNode) gainNode.gain.value = 0;
  document.getElementById("soundBtn").textContent = soundEnabled ? "音: ON" : "音: OFF";
});
</script>

</body>
