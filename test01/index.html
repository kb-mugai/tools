<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Acoustic Modem V14 - Dual-Tone Advanced</title>
    <style>
        body { font-family: 'Consolas', monospace; background: #050505; color: #00ff41; padding: 20px; }
        .card { border: 1px solid #00ff41; padding: 15px; background: rgba(0,255,65,0.05); margin-bottom: 15px; box-shadow: 0 0 15px rgba(0,255,0,0.3); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .param-group { border: 1px inset #444; padding: 10px; margin-top: 5px; }
        label { font-size: 11px; color: #888; display: block; }
        input, select { background: #000; color: #0f0; border: 1px solid #0f0; width: 90%; padding: 5px; margin-bottom: 5px; }
        button { background: #00ff41; color: #000; border: none; padding: 15px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1em; }
        #rxResult { font-size: 2.2em; color: #fff; min-height: 1.5em; border: 1px solid #0f0; padding: 15px; margin-top: 10px; background: #111; word-break: break-all; }
        canvas { width: 100%; height: 80px; background: #000; border: 1px solid #333; }
    </style>
</head>
<body>

<div class="card">
    <h3>Dual-Tone Sound Engine</h3>
    <div class="grid">
        <div class="param-group">
            <strong>LOW GROUP (2-bit)</strong>
            <label>Waveform (OSC 1)</label>
            <select id="wave1">
                <option value="sine">Sine (Stable)</option>
                <option value="triangle" selected>Triangle (Soft)</option>
                <option value="square">Square (Retro)</option>
                <option value="sawtooth">Sawtooth (Aggressive)</option>
            </select>
            <label>Start Frequency (Hz)</label>
            <input type="number" id="fLowStart" value="1000">
            <label>Step Gap (Hz)</label>
            <input type="number" id="fLowStep" value="400">
        </div>
        <div class="param-group">
            <strong>HIGH GROUP (2-bit)</strong>
            <label>Waveform (OSC 2)</label>
            <select id="wave2">
                <option value="sine" selected>Sine (Stable)</option>
                <option value="triangle">Triangle (Soft)</option>
                <option value="square">Square (Retro)</option>
                <option value="sawtooth">Sawtooth (Aggressive)</option>
            </select>
            <label>Start Frequency (Hz)</label>
            <input type="number" id="fHighStart" value="4000">
            <label>Step Gap (Hz)</label>
            <input type="number" id="fHighStep" value="600">
        </div>
    </div>
    <div class="grid" style="margin-top:10px;">
        <div>Base(fB): <input type="number" id="fB" value="500">Hz</div>
        <div>DataMs: <input type="number" id="dMs" value="100">ms</div>
        <div>BaseMs: <input type="number" id="bMs" value="20">ms</div>
    </div>
</div>

<div class="card">
    <input type="text" id="txMsg" value="OK GO" style="width:75%; font-size:1.5em; padding:10px;">
    <button onclick="send()">TRANSMIT ⚡</button>
</div>

<div class="card">
    <button onclick="toggleRx()">ACTIVATE RECEIVER</button>
    <canvas id="visualizer"></canvas>
    <div id="status">STATUS: OFFLINE</div>
    <div id="rxResult"></div>
</div>

<script>
let audioCtx, isRx = false, animationId;

function getParams() {
    const lStart = +document.getElementById('fLowStart').value;
    const lStep = +document.getElementById('fLowStep').value;
    const hStart = +document.getElementById('fHighStart').value;
    const hStep = +document.getElementById('fHighStep').value;

    return {
        fB: +document.getElementById('fB').value,
        lowGroup: [0,1,2,3].map(i => lStart + (i * lStep)),
        highGroup: [0,1,2,3].map(i => hStart + (i * hStep)),
        wave1: document.getElementById('wave1').value,
        wave2: document.getElementById('wave2').value,
        dMs: +document.getElementById('dMs').value / 1000,
        bMs: +document.getElementById('bMs').value / 1000,
        thresh: 70
    };
}

async function send() {
    if (!audioCtx) audioCtx = new AudioContext();
    const p = getParams();
    const msg = document.getElementById('txMsg').value;
    
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc1.type = p.wave1;
    osc2.type = p.wave2;
    osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
    gain.gain.value = 0.4;

    let now = audioCtx.currentTime;
    osc1.start(now); osc2.start(now);
    
    // Sync Start
    osc1.frequency.setValueAtTime(p.fB, now);
    osc2.frequency.setValueAtTime(0, now);
    now += p.dMs * 3;

    for (let i = 0; i < msg.length; i++) {
        const code = msg.charCodeAt(i);
        const nibbles = [(code >> 4) & 0x0F, code & 0x0F];
        
        for (let val of nibbles) {
            const lIdx = (val >> 2) & 0x03;
            const hIdx = val & 0x03;
            osc1.frequency.setValueAtTime(p.lowGroup[lIdx], now);
            osc2.frequency.setValueAtTime(p.highGroup[hIdx], now);
            now += p.dMs;
            
            // Base音 (最短20msの設定が可能)
            osc1.frequency.setValueAtTime(p.fB, now);
            osc2.frequency.setValueAtTime(0, now);
            now += p.bMs;
        }
    }
    osc1.stop(now + 0.1); osc2.stop(now + 0.1);
}

async function toggleRx() {
    if (isRx) { isRx = false; cancelAnimationFrame(animationId); return; }
    isRx = true;
    document.getElementById('rxResult').innerText = "";
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false } });
    audioCtx = new AudioContext();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);

    const freqData = new Uint8Array(analyser.frequencyBinCount);
    const p = getParams();
    let isDecoding = false, nibs = [], lastState = "base";

    function loop() {
        if (!isRx) return;
        analyser.getByteFrequencyData(freqData);
        const binSize = audioCtx.sampleRate / analyser.fftSize;
        const getAmp = (f) => freqData[Math.round(f / binSize)];
        
        const aB = getAmp(p.fB);
        const lAmps = p.lowGroup.map(f => getAmp(f));
        const hAmps = p.highGroup.map(f => getAmp(f));
        const maxL = Math.max(...lAmps), maxH = Math.max(...hAmps);

        if (!isDecoding && aB > p.thresh) {
            isDecoding = true;
            document.getElementById('status').innerText = "STATUS: ONLINE";
        }

        if (isDecoding) {
            if (lastState === "base" && maxL > p.thresh && maxH > p.thresh) {
                nibs.push((lAmps.indexOf(maxL) << 2) | hAmps.indexOf(maxH));
                lastState = "data";
                if (nibs.length === 2) {
                    document.getElementById('rxResult').innerText += String.fromCharCode((nibs[0] << 4) | nibs[1]);
                    nibs = [];
                }
            } else if (lastState === "data" && aB > p.thresh && maxL < p.thresh) {
                lastState = "base";
            }
        }
        animationId = requestAnimationFrame(loop);
    }
    loop();
}
</script>
</body>
</html>
