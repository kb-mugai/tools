<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marble Ink Art Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: white; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }
        #drawingCanvas { z-index: 1; background: transparent; }
        #mainCanvas { z-index: 2; background: transparent; }

        /* UIレイヤー */
        #ui { position: absolute; bottom: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; pointer-events: none; z-index: 10; }
        .btns { display: flex; gap: 10px; }
        button { 
            padding: 15px 25px; font-size: 16px; border-radius: 30px; border: none; 
            background: #222; color: white; pointer-events: auto; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.1s;
        }
        button:active { transform: scale(0.95); }
        
        /* 設定ボタン（右上） */
        #configBtn { position: absolute; top: 20px; right: 20px; z-index: 20; padding: 10px; font-size: 24px; background: none; box-shadow: none; border-radius: 50%; }

        /* 設定パネル */
        #configPanel { 
            position: absolute; top: 0; right: -280px; width: 240px; height: 100%; 
            background: rgba(255, 255, 255, 0.95); z-index: 15; padding: 80px 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1); transition: 0.3s; pointer-events: auto;
        }
        #configPanel.open { right: 0; }
        .setting-item { margin-bottom: 30px; }
        .setting-item label { display: block; font-size: 14px; margin-bottom: 10px; font-weight: bold; }
        input[type=range] { width: 100%; }

        #timer { font-size: 20px; font-weight: bold; color: #222; background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 15px; }
    </style>
</head>
<body>

<canvas id="drawingCanvas"></canvas>
<canvas id="mainCanvas"></canvas>

<button id="configBtn">⚙️</button>

<div id="configPanel">
    <div class="setting-item">
        <label>インクの最大太さ</label>
        <input type="range" id="rangeThickness" min="10" max="100" value="40">
    </div>
    <div class="setting-item">
        <label>ドロドロ感（粘度）</label>
        <input type="range" id="rangeFriction" min="80" max="99" value="96">
    </div>
    <button id="closePanel" style="width: 100%;">閉じる</button>
</div>

<div id="ui">
    <div id="timer">Ink: 20.0s</div>
    <div class="btns">
        <button id="saveBtn">透過保存/共有</button>
        <button id="resetBtn" style="background: #555;">リセット</button>
    </div>
</div>

<script>
    const CONFIG = {
        INK_TIME_LIMIT: 20.0,
        BALL_RADIUS: 40,
        MIN_THICKNESS: 6,
        MAX_THICKNESS: 40,
        THICKNESS_SMOOTH: 0.15,
        SPEED_SENSITIVITY: 2.2,
        GRAVITY_COEFF: 0.12,
        FRICTION: 0.96,
        BOUNCE: -0.4
    };

    const dCanvas = document.getElementById('drawingCanvas');
    const mCanvas = document.getElementById('mainCanvas');
    const dCtx = dCanvas.getContext('2d');
    const mCtx = mCanvas.getContext('2d');
    const timerEl = document.getElementById('timer');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const configBtn = document.getElementById('configBtn');
    const configPanel = document.getElementById('configPanel');

    let width, height;
    let ball = { x: 0, y: 0, vx: 0, vy: 0 };
    let lastPos = { x: 0, y: 0 };
    let accel = { x: 0, y: 0 };
    let currentInkThickness = CONFIG.MAX_THICKNESS;
    let inkTime = CONFIG.INK_TIME_LIMIT;
    let isDrawing = false;
    let appStarted = false;

    function init() {
        width = window.innerWidth;
        height = window.innerHeight;
        dCanvas.width = mCanvas.width = width;
        dCanvas.height = mCanvas.height = height;
        ball.x = width / 2;
        ball.y = height / 2;
        ball.vx = ball.vy = 0;
        lastPos.x = ball.x;
        lastPos.y = ball.y;
        dCtx.clearRect(0, 0, width, height); 
        inkTime = CONFIG.INK_TIME_LIMIT;
        isDrawing = true;
    }

    // 設定更新
    document.getElementById('rangeThickness').addEventListener('input', (e) => {
        CONFIG.MAX_THICKNESS = parseInt(e.target.value);
    });

document.getElementById('rangeFriction').addEventListener('input', (e) => {
    const val = parseInt(e.target.value); // 0 〜 100
    CONFIG.FRICTION = 0.98 - (val / 100) * 0.18; 
});

    // パネル開閉
    configBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        configPanel.classList.add('open');
    });
    document.getElementById('closePanel').addEventListener('click', (e) => {
        e.stopPropagation();
        configPanel.classList.remove('open');
    });

    async function startApp() {
        if (appStarted) return;
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === 'granted') window.addEventListener('deviceorientation', handleOrientation);
            } catch (e) { console.error(e); }
        } else {
            window.addEventListener('deviceorientation', handleOrientation);
        }
        appStarted = true;
        init();
        update();
    }

    function handleOrientation(e) {
        accel.x = (e.gamma || 0) * CONFIG.GRAVITY_COEFF;
        accel.y = (e.beta || 0) * CONFIG.GRAVITY_COEFF;
    }

    function update() {
        if (inkTime <= 0) { isDrawing = false; inkTime = 0; }

        if (isDrawing) {
            ball.vx += accel.x;
            ball.vy += accel.y;
            ball.vx *= CONFIG.FRICTION;
            ball.vy *= CONFIG.FRICTION;
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x < CONFIG.BALL_RADIUS) { ball.x = CONFIG.BALL_RADIUS; ball.vx *= CONFIG.BOUNCE; }
            if (ball.x > width - CONFIG.BALL_RADIUS) { ball.x = width - CONFIG.BALL_RADIUS; ball.vx *= CONFIG.BOUNCE; }
            if (ball.y < CONFIG.BALL_RADIUS) { ball.y = CONFIG.BALL_RADIUS; ball.vy *= CONFIG.BOUNCE; }
            if (ball.y > height - CONFIG.BALL_RADIUS) { ball.y = height - CONFIG.BALL_RADIUS; ball.vy *= CONFIG.BOUNCE; }

            const speed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
            const targetThickness = Math.max(CONFIG.MIN_THICKNESS, CONFIG.MAX_THICKNESS - speed * CONFIG.SPEED_SENSITIVITY);
            currentInkThickness += (targetThickness - currentInkThickness) * CONFIG.THICKNESS_SMOOTH;

            dCtx.beginPath();
            dCtx.strokeStyle = "black";
            dCtx.lineWidth = currentInkThickness;
            dCtx.lineCap = "round";
            dCtx.lineJoin = "round";
            dCtx.moveTo(lastPos.x, lastPos.y);
            dCtx.lineTo(ball.x, ball.y);
            dCtx.stroke();

            lastPos.x = ball.x;
            lastPos.y = ball.y;
            inkTime -= 1/60;
        }

        mCtx.clearRect(0, 0, width, height);
        mCtx.drawImage(dCanvas, 0, 0);
        
        if (isDrawing) {
            mCtx.beginPath();
            mCtx.fillStyle = "rgba(0, 0, 0, 0.4)";
            mCtx.arc(ball.x, ball.y, CONFIG.BALL_RADIUS, 0, Math.PI * 2);
            mCtx.fill();
        }

        timerEl.innerText = `Ink: ${inkTime.toFixed(1)}s`;
        requestAnimationFrame(update);
    }

    // 共有・保存
    saveBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        dCanvas.toBlob(async (blob) => {
            const file = new File([blob], `marble-art-${Date.now()}.png`, { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try { await navigator.share({ files: [file], title: 'Marble Art' }); } catch (err) {}
            } else {
                const link = document.createElement('a');
                link.download = file.name; link.href = URL.createObjectURL(blob); link.click();
            }
        }, "image/png");
    });

    window.addEventListener('click', startApp, { once: true });
    resetBtn.addEventListener('click', (e) => { e.stopPropagation(); init(); });
    window.addEventListener('resize', init);
</script>
</body>
</html>
