<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marble Ink Art</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; font-family: sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }
        #ui { position: absolute; bottom: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
        button { 
            padding: 12px 24px; font-size: 16px; border-radius: 25px; border: none; 
            background: #333; color: white; pointer-events: auto; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        button:disabled { background: #999; }
        #timer { font-size: 24px; font-weight: bold; color: #333; text-shadow: 1px 1px 2px white; }
    </style>
</head>
<body>

<!-- 描画レイヤー（保存対象） -->
<canvas id="drawingCanvas"></canvas>
<!-- 表示用レイヤー（ボール描画用） -->
<canvas id="mainCanvas"></canvas>

<div id="ui">
    <div id="timer">Ink: 10.0s</div>
    <button id="saveBtn">作品を保存する</button>
    <button id="resetBtn" style="background: #666;">もう一度描く</button>
</div>

<script>
    const dCanvas = document.getElementById('drawingCanvas');
    const mCanvas = document.getElementById('mainCanvas');
    const dCtx = dCanvas.getContext('2d');
    const mCtx = mCanvas.getContext('2d');
    const timerEl = document.getElementById('timer');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');

    let width, height;
    let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 12 };
    let accel = { x: 0, y: 0 };
    let inkTime = 10.0;
    let isDrawing = true;

    // 初期化
    function init() {
        width = window.innerWidth;
        height = window.innerHeight;
        dCanvas.width = mCanvas.width = width;
        dCanvas.height = mCanvas.height = height;
        
        ball.x = width / 2;
        ball.y = height / 2;
        ball.vx = 0;
        ball.vy = 0;
        
        dCtx.fillStyle = "white";
        dCtx.fillRect(0, 0, width, height);
        inkTime = 10.0;
        isDrawing = true;
        saveBtn.disabled = false;
    }

    // 加速度センサー（ジャイロ）の取得
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+ のための権限リクエスト
        mCanvas.addEventListener('click', () => {
            DeviceOrientationEvent.requestPermission().then(response => {
                if (response === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            });
        }, { once: true });
    } else {
        window.addEventListener('deviceorientation', handleOrientation);
    }

    function handleOrientation(e) {
        // 傾きに応じて加速度を設定
        accel.x = e.gamma * 0.1;
        accel.y = e.beta * 0.1;
    }

    function update() {
        if (inkTime <= 0) {
            isDrawing = false;
            inkTime = 0;
        }

        if (isDrawing) {
            // 物理演算
            ball.vx += accel.x;
            ball.vy += accel.y;
            ball.vx *= 0.98; // 摩擦
            ball.vy *= 0.98;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 壁判定
            if (ball.x < ball.radius) { ball.x = ball.radius; ball.vx *= -0.5; }
            if (ball.x > width - ball.radius) { ball.x = width - ball.radius; ball.vx *= -0.5; }
            if (ball.y < ball.radius) { ball.y = ball.radius; ball.vy *= -0.5; }
            if (ball.y > height - ball.radius) { ball.y = height - ball.radius; ball.vy *= -0.5; }

            // 描画（軌跡）
            const speed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
            // スピードが遅いほど太く（20px〜5pxの範囲で可変）
            const inkSize = Math.max(5, 30 - speed * 2.5);
            
            dCtx.beginPath();
            dCtx.fillStyle = "black";
            dCtx.arc(ball.x, ball.y, inkSize / 2, 0, Math.PI * 2);
            dCtx.fill();

            inkTime -= 1/60;
        }

        // メインキャンバスの描画
        mCtx.clearRect(0, 0, width, height);
        mCtx.drawImage(dCanvas, 0, 0); // 軌跡をコピー
        
        // ボールの表示（描画中のみ）
        if (isDrawing) {
            mCtx.beginPath();
            mCtx.fillStyle = "#555";
            mCtx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            mCtx.fill();
            // ボールのハイライト
            mCtx.beginPath();
            mCtx.fillStyle = "rgba(255,255,255,0.3)";
            mCtx.arc(ball.x - 4, ball.y - 4, 3, 0, Math.PI * 2);
            mCtx.fill();
        }

        timerEl.innerText = `Ink: ${inkTime.toFixed(1)}s`;
        requestAnimationFrame(update);
    }

    // 画像保存
    saveBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `marble-art-${Date.now()}.png`;
        link.href = dCanvas.toDataURL();
        link.click();
    });

    resetBtn.addEventListener('click', init);

    window.addEventListener('resize', init);
    init();
    update();
</script>
</body>
</html>
