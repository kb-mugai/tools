<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marble Ink Art Pro</title>
    <style>
        /* 1. 根本的な背景を白に固定 */
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: white; /* プレイ中の背景色 */
            font-family: sans-serif; 
        }
        
        /* 2. キャンバスの設定 */
        canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            touch-action: none; 
        }

        /* 保存用（下側） */
        #drawingCanvas { 
            z-index: 1; 
            background: transparent; /* ここは透明のまま */
        }

        /* 表示用（上側） */
        #mainCanvas { 
            z-index: 2; 
            background: transparent; 
        }
        
        #ui { position: absolute; bottom: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; pointer-events: none; z-index: 10; }
        .btns { display: flex; gap: 10px; }
        button { 
            padding: 15px 25px; font-size: 16px; border-radius: 30px; border: none; 
            background: #222; color: white; pointer-events: auto; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #bbb; }
        #timer { font-size: 20px; font-weight: bold; color: #222; background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 15px; }
    </style>
</head>
<body>

<canvas id="drawingCanvas"></canvas>
<canvas id="mainCanvas"></canvas>

<div id="ui">
    <div id="timer">Ink: 20.0s</div>
    <div class="btns">
        <button id="saveBtn">透過PNGを保存</button>
        <button id="resetBtn" style="background: #555;">リセット</button>
    </div>
</div>

<script>
    const CONFIG = {
        INK_TIME_LIMIT: 20.0,
        BALL_RADIUS: 40,
        MIN_THICKNESS: 6,
        MAX_THICKNESS: 40,
        THICKNESS_SMOOTH: 0.15,
        SPEED_SENSITIVITY: 2.2,
        GRAVITY_COEFF: 0.12,
        FRICTION: 0.96,
        BOUNCE: -0.4
    };

    const dCanvas = document.getElementById('drawingCanvas');
    const mCanvas = document.getElementById('mainCanvas');
    const dCtx = dCanvas.getContext('2d');
    const mCtx = mCanvas.getContext('2d');
    const timerEl = document.getElementById('timer');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');

    let width, height;
    let ball = { x: 0, y: 0, vx: 0, vy: 0 };
    let lastPos = { x: 0, y: 0 };
    let accel = { x: 0, y: 0 };
    let currentInkThickness = CONFIG.MAX_THICKNESS;
    let inkTime = CONFIG.INK_TIME_LIMIT;
    let isDrawing = false;
    let appStarted = false;

    function init() {
        width = window.innerWidth;
        height = window.innerHeight;
        dCanvas.width = mCanvas.width = width;
        dCanvas.height = mCanvas.height = height;
        
        ball.x = width / 2;
        ball.y = height / 2;
        ball.vx = 0;
        ball.vy = 0;
        lastPos.x = ball.x;
        lastPos.y = ball.y;
        
        // 保存用キャンバスを完全に透明にする
        dCtx.clearRect(0, 0, width, height); 
        
        inkTime = CONFIG.INK_TIME_LIMIT;
        currentInkThickness = CONFIG.MAX_THICKNESS;
        isDrawing = true;
        saveBtn.disabled = false;
    }

    async function startApp() {
        if (appStarted) return;
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === 'granted') {
                    window.addEventListener('deviceorientation', handleOrientation);
                }
            } catch (e) { console.error(e); }
        } else {
            window.addEventListener('deviceorientation', handleOrientation);
        }
        appStarted = true;
        init();
        update();
    }

    function handleOrientation(e) {
        accel.x = (e.gamma || 0) * CONFIG.GRAVITY_COEFF;
        accel.y = (e.beta || 0) * CONFIG.GRAVITY_COEFF;
    }

    function update() {
        if (inkTime <= 0) {
            isDrawing = false;
            inkTime = 0;
        }

        if (isDrawing) {
            ball.vx += accel.x;
            ball.vy += accel.y;
            ball.vx *= CONFIG.FRICTION;
            ball.vy *= CONFIG.FRICTION;
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x < CONFIG.BALL_RADIUS) { ball.x = CONFIG.BALL_RADIUS; ball.vx *= CONFIG.BOUNCE; }
            if (ball.x > width - CONFIG.BALL_RADIUS) { ball.x = width - CONFIG.BALL_RADIUS; ball.vx *= CONFIG.BOUNCE; }
            if (ball.y < CONFIG.BALL_RADIUS) { ball.y = CONFIG.BALL_RADIUS; ball.vy *= CONFIG.BOUNCE; }
            if (ball.y > height - CONFIG.BALL_RADIUS) { ball.y = height - CONFIG.BALL_RADIUS; ball.vy *= CONFIG.BOUNCE; }

            const speed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
            const targetThickness = Math.max(CONFIG.MIN_THICKNESS, CONFIG.MAX_THICKNESS - speed * CONFIG.SPEED_SENSITIVITY);
            currentInkThickness += (targetThickness - currentInkThickness) * CONFIG.THICKNESS_SMOOTH;

            dCtx.beginPath();
            dCtx.strokeStyle = "black";
            dCtx.lineWidth = currentInkThickness;
            dCtx.lineCap = "round";
            dCtx.lineJoin = "round";
            dCtx.moveTo(lastPos.x, lastPos.y);
            dCtx.lineTo(ball.x, ball.y);
            dCtx.stroke();

            lastPos.x = ball.x;
            lastPos.y = ball.y;
            inkTime -= 1/60;
        }

        mCtx.clearRect(0, 0, width, height);
        // 背景が透けて見えるように上書き
        mCtx.drawImage(dCanvas, 0, 0);
        
        if (isDrawing) {
            mCtx.beginPath();
            mCtx.fillStyle = "rgba(0, 0, 0, 0.4)"; // ビー玉本体（半透明の黒）
            mCtx.arc(ball.x, ball.y, CONFIG.BALL_RADIUS, 0, Math.PI * 2);
            mCtx.fill();
            mCtx.beginPath();
            mCtx.fillStyle = "rgba(255, 255, 255, 0.3)"; // 光沢
            mCtx.arc(ball.x - CONFIG.BALL_RADIUS*0.3, ball.y - CONFIG.BALL_RADIUS*0.3, CONFIG.BALL_RADIUS*0.2, 0, Math.PI * 2);
            mCtx.fill();
        }

        timerEl.innerText = `Ink: ${inkTime.toFixed(1)}s`;
        requestAnimationFrame(update);
    }

    window.addEventListener('click', startApp, { once: true });
    
saveBtn.addEventListener('click', async (e) => {
    e.stopPropagation();

    // 1. Canvasから画像データ（Blob）を作成
    dCanvas.toBlob(async (blob) => {
        const file = new File([blob], `marble-art-${Date.now()}.png`, { type: "image/png" });

        // 2. Web Share APIが使えるか確認
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
                // 3. 共有シートを起動
                await navigator.share({
                    files: [file],
                    title: 'Marble Art',
                    text: 'ビー玉アートで作った作品です'
                });
            } catch (err) {
                console.error("Share failed", err);
            }
        } else {
            // Web Share API非対応（PCなど）の場合は従来のダウンロード
            const link = document.createElement('a');
            link.download = file.name;
            link.href = URL.createObjectURL(blob);
            link.click();
        }
    }, "image/png");
});

    resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        init();
    });

    window.addEventListener('resize', init);
</script>
</body>
</html>
