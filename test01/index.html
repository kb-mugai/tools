<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ビー玉アート Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: white; font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif; }
        canvas { display: block; position: absolute; top: 0; left: 0; touch-action: none; }
        #drawingCanvas { z-index: 1; background: transparent; }
        #mainCanvas { z-index: 2; background: transparent; }

        /* 操作ミス防止 */
        button, input, select, #configPanel { touch-action: manipulation; }

        /* スタート画面 */
        #startOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; text-align: center;
        }
        .start-title { font-size: 28px; font-weight: bold; margin-bottom: 10px; color: #222; }
        .start-guide { font-size: 14px; color: #666; }

        /* UI（下部ボタン） */
        #ui { position: absolute; bottom: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px; pointer-events: none; z-index: 10; }
        .btns { display: flex; gap: 10px; }
        button { 
            padding: 15px 25px; font-size: 16px; border-radius: 30px; border: none; 
            background: #222; color: white; pointer-events: auto; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.1s;
        }
        button:active { transform: scale(0.95); }
        
        /* 設定パネル */
        #configBtn { position: absolute; top: 20px; right: 20px; z-index: 20; padding: 10px; font-size: 24px; background: none; box-shadow: none; border-radius: 50%; }
        #configPanel { 
            position: absolute; top: 0; right: -300px; width: 260px; height: 100%; 
            background: rgba(255, 255, 255, 0.98); z-index: 15; padding: 60px 20px;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1); transition: 0.3s; pointer-events: auto;
            overflow-y: auto;
        }
        #configPanel.open { right: 0; }

        .panel-title { font-size: 20px; font-weight: bold; margin-bottom: 5px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .panel-ver { font-size: 10px; color: #aaa; margin-bottom: 25px; display: block; }
        
        .setting-item { margin-bottom: 25px; }
        .setting-item label { display: block; font-size: 13px; margin-bottom: 8px; font-weight: bold; color: #444; }
        input[type=range], select { width: 100%; box-sizing: border-box; }
        
        .note { font-size: 11px; color: #888; line-height: 1.6; margin-top: 30px; padding: 15px; background: #f9f9f9; border-radius: 10px; }

        #timer { font-size: 18px; font-weight: bold; color: #222; background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 15px; border: 1px solid rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div id="startOverlay">
    <div class="start-title">ビー玉アート Pro</div>
    <div class="start-guide">画面をタッチしてスタート</div>
</div>

<canvas id="drawingCanvas"></canvas>
<canvas id="mainCanvas"></canvas>

<button id="configBtn">⚙️</button>

<div id="configPanel">
    <div class="panel-title">ビー玉アート Pro</div>
    <span class="panel-ver">v1.0.0</span>

    <div class="setting-item">
        <label>インクの最大太さ</label>
        <input type="range" id="rangeThickness" min="10" max="100" value="40">
    </div>
    <div class="setting-item">
        <label>インクの粘度 (右＝重め)</label>
        <input type="range" id="rangeFriction" min="0" max="100" value="20">
    </div>
    <div class="setting-item">
        <label>保存時の背景</label>
        <select id="bgSelect">
            <option value="transparent">透明 (線画用)</option>
            <option value="white">白色 (SNS共有用)</option>
        </select>
    </div>

    <button id="closePanel" style="width: 100%; margin-top: 10px;">閉じる</button>

    <div class="note">
        【使い方】<br>
        ・端末を傾けてビー玉を転がします。<br>
        ・インクが切れるまで描画できます。<br>
        ・「透過」は線画素材として利用可能です。<br>
        ・保存時は共有シートが開きます。
    </div>
</div>

<div id="ui">
    <div id="timer">Ink: 20.0s</div>
    <div class="btns">
        <button id="saveBtn">保存 / 共有</button>
        <button id="resetBtn" style="background: #555;">リセット</button>
    </div>
</div>

<script>
    const CONFIG = {
        INK_TIME_LIMIT: 20.0,
        BALL_RADIUS: 40,
        MIN_THICKNESS: 6,
        MAX_THICKNESS: 40,
        THICKNESS_SMOOTH: 0.15,
        SPEED_SENSITIVITY: 2.2,
        GRAVITY_COEFF: 0.12,
        FRICTION: 0.96,
        BOUNCE: -0.4
    };

    const dCanvas = document.getElementById('drawingCanvas');
    const mCanvas = document.getElementById('mainCanvas');
    const dCtx = dCanvas.getContext('2d');
    const mCtx = mCanvas.getContext('2d');
    const timerEl = document.getElementById('timer');
    const saveBtn = document.getElementById('saveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const configBtn = document.getElementById('configBtn');
    const configPanel = document.getElementById('configPanel');
    const startOverlay = document.getElementById('startOverlay');
    const rangeFriction = document.getElementById('rangeFriction');
    const rangeThickness = document.getElementById('rangeThickness');
    const bgSelect = document.getElementById('bgSelect');

    let width, height;
    let ball = { x: 0, y: 0, vx: 0, vy: 0 };
    let lastPos = { x: 0, y: 0 };
    let accel = { x: 0, y: 0 };
    let currentInkThickness = CONFIG.MAX_THICKNESS;
    let inkTime = CONFIG.INK_TIME_LIMIT;
    let isDrawing = false;
    let appStarted = false;

    function syncSettings() {
        const fVal = parseInt(rangeFriction.value);
        CONFIG.FRICTION = 0.98 - (fVal / 100) * 0.18;
        CONFIG.MAX_THICKNESS = parseInt(rangeThickness.value);
    }

    function init() {
        width = window.innerWidth;
        height = window.innerHeight;
        dCanvas.width = mCanvas.width = width;
        dCanvas.height = mCanvas.height = height;
        ball.x = width / 2;
        ball.y = height / 2;
        ball.vx = ball.vy = 0;
        lastPos.x = ball.x;
        lastPos.y = ball.y;
        dCtx.clearRect(0, 0, width, height); 
        syncSettings();
        inkTime = CONFIG.INK_TIME_LIMIT;
        isDrawing = true;
    }

    rangeThickness.addEventListener('input', syncSettings);
    rangeFriction.addEventListener('input', syncSettings);

    configBtn.addEventListener('click', (e) => { e.stopPropagation(); configPanel.classList.add('open'); });
    document.getElementById('closePanel').addEventListener('click', (e) => { e.stopPropagation(); configPanel.classList.remove('open'); });

    startOverlay.addEventListener('click', async () => {
        if (appStarted) return;
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const response = await DeviceOrientationEvent.requestPermission();
                if (response === 'granted') window.addEventListener('deviceorientation', handleOrientation);
            } catch (e) { console.error(e); }
        } else {
            window.addEventListener('deviceorientation', handleOrientation);
        }
        appStarted = true;
        startOverlay.style.display = 'none';
        init();
        update();
    });

    function handleOrientation(e) {
        accel.x = (e.gamma || 0) * CONFIG.GRAVITY_COEFF;
        accel.y = (e.beta || 0) * CONFIG.GRAVITY_COEFF;
    }

    function update() {
        if (!appStarted) return;
        if (inkTime <= 0) { isDrawing = false; inkTime = 0; }

        if (isDrawing) {
            ball.vx += accel.x;
            ball.vy += accel.y;
            ball.vx *= CONFIG.FRICTION;
            ball.vy *= CONFIG.FRICTION;
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x < CONFIG.BALL_RADIUS) { ball.x = CONFIG.BALL_RADIUS; ball.vx *= CONFIG.BOUNCE; }
            if (ball.x > width - CONFIG.BALL_RADIUS) { ball.x = width - CONFIG.BALL_RADIUS; ball.vx *= CONFIG.BOUNCE; }
            if (ball.y < CONFIG.BALL_RADIUS) { ball.y = CONFIG.BALL_RADIUS; ball.vy *= CONFIG.BOUNCE; }
            if (ball.y > height - CONFIG.BALL_RADIUS) { ball.y = height - CONFIG.BALL_RADIUS; ball.vy *= CONFIG.BOUNCE; }

            const speed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
            const targetThickness = Math.max(CONFIG.MIN_THICKNESS, CONFIG.MAX_THICKNESS - speed * CONFIG.SPEED_SENSITIVITY);
            currentInkThickness += (targetThickness - currentInkThickness) * CONFIG.THICKNESS_SMOOTH;

            dCtx.beginPath();
            dCtx.strokeStyle = "black";
            dCtx.lineWidth = currentInkThickness;
            dCtx.lineCap = "round";
            dCtx.lineJoin = "round";
            dCtx.moveTo(lastPos.x, lastPos.y);
            dCtx.lineTo(ball.x, ball.y);
            dCtx.stroke();

            lastPos.x = ball.x;
            lastPos.y = ball.y;
            inkTime -= 1/60;
        }

        mCtx.clearRect(0, 0, width, height);
        mCtx.drawImage(dCanvas, 0, 0);
        if (isDrawing) {
            mCtx.beginPath();
            mCtx.fillStyle = "rgba(0, 0, 0, 0.4)";
            mCtx.arc(ball.x, ball.y, CONFIG.BALL_RADIUS, 0, Math.PI * 2);
            mCtx.fill();
        }
        timerEl.innerText = `Ink: ${inkTime.toFixed(1)}s`;
        requestAnimationFrame(update);
    }

    saveBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        
        let targetCanvas = dCanvas;
        if (bgSelect.value === 'white') {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width; tempCanvas.height = height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = "white";
            tCtx.fillRect(0, 0, width, height);
            tCtx.drawImage(dCanvas, 0, 0);
            targetCanvas = tempCanvas;
        }

        targetCanvas.toBlob(async (blob) => {
            const file = new File([blob], `marble-art-${Date.now()}.png`, { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try { await navigator.share({ files: [file], title: 'ビー玉アート Pro' }); } catch (err) {}
            } else {
                const link = document.createElement('a');
                link.download = file.name; link.href = URL.createObjectURL(blob); link.click();
            }
        }, "image/png");
    });

    resetBtn.addEventListener('click', (e) => { e.stopPropagation(); init(); });
    window.addEventListener('resize', init);
</script>
</body>
</html>
