<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="favicon.png" type="image/png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>うんこ暗号（UNKO CRYPT）｜ウンコ・クリプト｜登録不要・無料面白webツール</title>
<meta name="description" content="言葉をうんこに変換して暗号化します。登録不要・無料で使えます。">

<link rel="stylesheet" href="../common.css">
    <style>
        :root { --main-brown: #6f4e37; --bg-color: #fdf6e3; }
        body { font-family: sans-serif; background: var(--bg-color); text-align: center; padding: 20px; color: #3e2723; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 20px; border: 5px solid var(--main-brown); box-shadow: 0 10px 0 #d7ccc8; }
        h1 { margin-top: 0; font-size: 1.5em; }
        textarea { width: 100%; height: 120px; border: 2px solid #ddd; border-radius: 12px; padding: 10px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; resize: none; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 10px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1em; }
        .enc { background: var(--main-brown); color: white; }
        .dec { background: #2196F3; color: white; }
        .copy-btn { background: #c75102; color: white; width: 100%; margin-top: 5px; }
        button:active { transform: scale(0.95); opacity: 0.8; }
        .info { font-size: 0.75em; color: #8d6e63; margin-top: 15px; }
        .nav-wrapper {
    max-width: 500px;    /* ★コンテナのmax-widthと同じ値にする */
    margin: 0 auto 10px; /* 中央寄せ(auto)にしつつ、下に少し隙間(10px)を作る */
    text-align: left;    /* 中身のリンクを左に寄せる */
    padding: 0 25px;     /* ★コンテナのpaddingと同じ値にすると、さらに完璧に揃う */
    box-sizing: border-box; /* パディングを含めて幅を計算 */
}
/* ボタンを横に並べるコンテナ */
.share-area {
    display: flex;
    gap: 10px;          /* ボタン同士の隙間 */
    margin-top: 20px;
    width: 100%;        /* 親要素の幅に合わせる */
}

/* 共通のボタン基本スタイル */
.share-area button {
    flex: 1;            /* 1:1の比率で可能な限り広がる */
    /* max-width: 180px; ← これがあると、広がりが止まってしまうので削除または大きくする */
    padding: 15px 5px;  /* 上下パディングを少し増やして押しやすく */
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;    /* 文字も少し大きくするとバランスが良いです */
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.share-area button:active {
    transform: scale(0.95); /* 押した時に少し凹む演出 */
}

/* LINEボタン：ブランドカラー（緑） */
.btn-line {
    background-color: #06C755;
}

.btn-line:hover {
    background-color: #05b34c;
}

/* Xボタン：ブランドカラー（黒） */
.btn-x {
    background-color: #000000;
}

.btn-x:hover {
    background-color: #333333;
}

/* ちょっとしたアイコン代わりの絵文字 */
.btn-line::before { content: "💬 "; margin-right: 5px; }
.btn-x::before { content: "𝕏 "; margin-right: 5px; }
    </style>
</head>
<body>
<div class="nav-wrapper">
        <a href="../" class="back-button">← トップページに戻る</a>
    </div>  
<div class="container">
        <h1>うんこくりぷとver.1.1.0</h1>
        <h1>💩 UNKO CRYPT 🚽</h1>
        素敵な暗号化ツール（ジョークの範囲でお使いください）
        <textarea id="input" placeholder="ここに平文または暗号文を入力..."></textarea>
        
        <div class="btn-group">
            <button class="enc" onclick="doProcess(true)">暗号化</button>
            <button class="dec" onclick="doProcess(false)">復号</button>
        </div>

        <div class="btn-group">
            <button style="background:#ff9800; color:white;" onclick="swapText()">⬆️ 入力へ戻す</button>
            <button style="background:#f44336; color:white;" onclick="clearAll()">🗑️ ぜんぶ消す</button>
        </div>

        <p style="text-align: left; margin: 10px 0 5px; font-weight: bold;">結果:</p>
        <textarea id="output" readonly></textarea>
<div class="share-area">
    <button onclick="shareLINE()" class="btn-line">LINEで送る</button>
    <button onclick="shareX()" class="btn-x">Xでポスト</button>
</div>
        <button class="copy-btn" onclick="copyResult()" style="width:100%; margin-top:8px;">💩 うんこをコピーする</button>

        <p class="info">※このドメイン以外では正しく解読できません</p>
    </div>

    <script>
  // 1. テーブルと設定
const T = ["ぶ","り","ブ","💩","リ","う","ん","こ","🧻","🍌","ウ","🚽","ン","コ","🍛","🍦"];
const SALT = 99;

// 2. ドメインからシード値を計算
function getSeed() {
    const h = window.location.hostname || "localhost";
    let s = 0; 
    for(let i=0; i<h.length; i++) s += h.charCodeAt(i);
    return (s + SALT) % 256;
}

// 3. メインの暗号・復号処理
function doProcess(isEnc) {
    const input = document.getElementById('input').value;
    const seed = getSeed();
    let res = "";
    try {
        if(isEnc) {
            const bytes = new TextEncoder().encode(input);
            bytes.forEach((b, i) => {
                let s = (b + seed + i) % 256;
                let h = s.toString(16).padStart(2, '0');
                res += T[parseInt(h[0], 16)] + T[parseInt(h[1], 16)];
            });
        } else {
            const emos = Array.from(input);
            const bytes = [];
            for(let i=0; i<emos.length; i+=2) {
                const h1 = T.indexOf(emos[i]).toString(16);
                const h2 = T.indexOf(emos[i+1]).toString(16);
                if(h1 === "-1" || h2 === "-1") throw new Error();
                let s = parseInt(h1 + h2, 16);
                bytes.push((s - seed - (i/2) % 256 + 256) % 256);
            }
            res = new TextDecoder().decode(new Uint8Array(bytes));
        }
        document.getElementById('output').value = res;
    } catch(e) { 
        document.getElementById('output').value = "💩 うんこ戻せません！正しいうんこを入れてね"; 
    }
}



// 【入力へ戻す】結果を上の入力欄に移動させる
function swapText() {
    const out = document.getElementById('output').value;
    if(!out || out.includes("解読失敗")) return; // 失敗時は送らない
    document.getElementById('input').value = out;
    document.getElementById('output').value = "";
}

// 【クリア】全部消してリセット
function clearAll() {
    if(confirm("きれいに流して消去しますか？💩")) {
        document.getElementById('input').value = "";
        document.getElementById('output').value = "";
    }
}

// 【コピー】クリップボードに保存
function copyResult() {
    const out = document.getElementById('output');
    if(!out.value) return;
    navigator.clipboard.writeText(out.value).then(() => {
        const btn = document.querySelector('.copy-btn');
        const oldText = btn.innerText;
        btn.innerText = "✅ うんコピー完了！";
        setTimeout(() => btn.innerText = oldText, 2000);
    });
}

// 共通のデータ取得関数
function getShareBase() {
    const text = document.getElementById('output').value;
    if(!text) {
        alert("まずは暗号化してください💩");
        return null;
    }
    const encodedData = encodeURIComponent(text);
    const shareUrl = window.location.origin + window.location.pathname + "?d=" + encodedData;
    return { text, shareUrl };
}

// --- LINE専用（密談：暗号＋データ付きURL） ---
function shareLINE() {
    const data = getShareBase(); // 暗号とデータ付きURLを取得
    if(!data) return;

    // LINEはそのままリンクを踏ませて即復号させたいので、データ付きURLを使用
    const lineText = `${data.text}\n\n解読はこちら：\n${data.shareUrl}`;
    const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(lineText)}`;
    window.open(lineUrl, '_blank');
}

// --- X専用（拡散：暗号＋タグ＋短いURL） ---
function shareX() {
    const data = getShareBase();
    if(!data) return;

    // Xは「暗号そのもの」を本文に載せ、URLはデータを含まないトップURLにする
    // これによりQRコード化してもスッキリする
    const topUrl = window.location.origin + window.location.pathname; 
    const xText = `${data.text}\n\n#うんこ暗号 #UNKO_CRYPT\n`;
    
    const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(xText)}&url=${encodeURIComponent(topUrl)}`;
    
    window.open(xUrl, '_blank');
}
// ページが開かれた時に実行される処理
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const data = urlParams.get('d');
    if (data) {
        // URLに暗号データがあれば、上の入力欄にセットする
        document.getElementById('input').value = data;
        // ※ ここで doProcess(false) を呼ばなければ、自動復号はされません。
        // ユーザーが自分で「復号」ボタンを押す楽しみが残ります！
    }
}

    </script>

</body>
</html>
